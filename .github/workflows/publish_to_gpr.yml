name: Publish to GPR

on:
  push:
    branches: ["ver/**"]

permissions:
  contents: write
  packages: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Setting up Java 21
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      # Applying Patches
      - name: apply-patches
        uses: gradle/gradle-build-action@v3
        with:
          arguments: applyAllPatches
      # Publishing
      - name: publish-to-gpr
        uses: gradle/gradle-build-action@v3
        with:
          arguments: publishPackagesPublicationToGprRepository
        env:
          # GitHub Packages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
