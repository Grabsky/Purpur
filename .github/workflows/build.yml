name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v4
      # Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      # Gradle
      - uses: gradle/actions/setup-gradle@v4
      # Configuring Git
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      # Applying Patches
      - name: Apply Patches
        run: ./gradlew applyAllPatches --no-daemon --stacktrace
      # Building
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      # Publishing
      - name: Publish to GPR
        uses: gradle/gradle-build-action@v3
        with:
          arguments: publishPackagesPublicationToGprRepository --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For GPR
      # Rebuilding on Failure
      - name: Rebuild on Failure
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --no-daemon --stacktrace 
          ./gradlew build --no-daemon --stacktrace
